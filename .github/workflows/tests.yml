name: tests
# Runs the no-UE tests (synthetic fixture + mock UE receiver) in Blender on every PR and on main.
# UE-side changes (ue/) still need the maintainer's run on the server: see CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "5.2.2"
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar xJ -C ~/blender --strip-components=1
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxxf86vm1 libxfixes3 > /dev/null
      - name: Library test (renou_blsync_lib)
        run: ~/blender/blender -b --factory-startup --python-exit-code 1 --python tests/test_lib_mock.py -- build
      - name: Add-on test (LS01)
        run: ~/blender/blender -b --factory-startup --python-exit-code 1 --python tests/test_addon_mock.py -- build
      - name: Build add-on zip
        run: python3 tools/build_addon.py
      - name: Check extension packaging
        run: python3 tests/test_extension_package.py
      - name: Validate Blender extension archive
        run: ~/blender/blender --command extension validate "$(ls build/renou_blsync-*.zip)"
      - name: Smoke-test packaged extension
        run: ~/blender/blender -b --factory-startup --python-exit-code 1 --python tests/test_extension_import.py
      - uses: actions/upload-artifact@v4
        with:
          name: renou_blsync-addon
          path: build/renou_blsync-*.zip
